<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-hub chat</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
    background: #0f1115; color: #e6e6e6;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid #2a2e37;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  select, button {
    font: inherit; background: #1b1f27; color: #e6e6e6;
    border: 1px solid #353b47; border-radius: 8px; padding: 6px 10px;
  }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 760px; width: fit-content; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; }
  .assistant { align-self: flex-start; background: #1b1f27; border: 1px solid #2a2e37; }
  .think { align-self: flex-start; max-width: 760px; font-size: 12px; color: #8a92a6; }
  .think summary { cursor: pointer; }
  .think pre { white-space: pre-wrap; margin: 6px 0 0; }
  footer { padding: 12px 16px; border-top: 1px solid #2a2e37; display: flex; gap: 8px; }
  textarea {
    flex: 1; resize: none; font: inherit; padding: 10px 12px;
    background: #1b1f27; color: #e6e6e6; border: 1px solid #353b47; border-radius: 10px;
    min-height: 44px; max-height: 160px;
  }
  .err { color: #f87171; }
  .hint { font-size: 12px; color: #8a92a6; }
</style>
</head>
<body>
  <header>
    <h1>ai-hub chat</h1>
    <label class="hint">model
      <select id="model">
        <option value="quality">quality (Qwen3 14B)</option>
        <option value="fast">fast (Llama3.1 8B)</option>
        <option value="gemma">gemma (Gemma4 12B)</option>
      </select>
    </label>
    <span class="spacer"></span>
    <button id="clear">クリア</button>
  </header>

  <div id="log"></div>

  <footer>
    <textarea id="input" placeholder="メッセージを入力 (Enterで送信 / Shift+Enterで改行)"></textarea>
    <button id="send">送信</button>
  </footer>

<script>
const logEl = document.getElementById("log");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const clearBtn = document.getElementById("clear");
const modelEl = document.getElementById("model");

// 全履歴をクライアントで保持し、毎回まるごと送る
let history = [];
let busy = false;

function addBubble(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = text;
  logEl.appendChild(el);
  logEl.scrollTop = logEl.scrollHeight;
  return el;
}

function addThink() {
  const d = document.createElement("details");
  d.className = "think";
  const s = document.createElement("summary");
  s.textContent = "思考過程";
  const pre = document.createElement("pre");
  d.appendChild(s); d.appendChild(pre);
  logEl.appendChild(d);
  return pre;
}

function autoGrow() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
}
inputEl.addEventListener("input", autoGrow);

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener("click", send);
clearBtn.addEventListener("click", () => {
  history = []; logEl.innerHTML = "";
});

async function send() {
  if (busy) return;
  const text = inputEl.value.trim();
  if (!text) return;

  history.push({ role: "user", content: text });
  addBubble("user", text);
  inputEl.value = ""; autoGrow();

  busy = true; sendBtn.disabled = true;
  const answerEl = addBubble("assistant", "");
  answerEl.textContent = "…";
  let thinkPre = null;
  let answer = "";
  let thinking = "";

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: modelEl.value, messages: history }),
    });

    if (!resp.ok || !resp.body) {
      const t = await resp.text();
      answerEl.classList.add("err");
      answerEl.textContent = "エラー: " + t;
      busy = false; sendBtn.disabled = false;
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();  // 未完の行は次回へ
      for (const line of lines) {
        const s = line.trim();
        if (!s.startsWith("data:")) continue;
        const data = s.slice(5).trim();
        if (data === "[DONE]") continue;
        let obj;
        try { obj = JSON.parse(data); } catch { continue; }
        const delta = (obj.choices && obj.choices[0] && obj.choices[0].delta) || {};
        if (delta.reasoning_content) {
          thinking += delta.reasoning_content;
          if (!thinkPre) thinkPre = addThink();
          thinkPre.textContent = thinking;
        }
        if (delta.content) {
          answer += delta.content;
          answerEl.textContent = answer;
        }
        logEl.scrollTop = logEl.scrollHeight;
      }
    }

    if (!answer && thinking) answer = "(思考のみ・本文なし)";
    answerEl.textContent = answer || "(空応答)";
    history.push({ role: "assistant", content: answer });
  } catch (e) {
    answerEl.classList.add("err");
    answerEl.textContent = "通信エラー: " + e.message;
  } finally {
    busy = false; sendBtn.disabled = false;
    inputEl.focus();
  }
}

inputEl.focus();
</script>
</body>
</html>

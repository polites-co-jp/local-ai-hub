# LiteLLM Proxy 設定 — 論理モデル名 → 実体(strata / ollama)のルーティング。
# クライアントは論理名(large / embed)のみ参照。実体は後から差し替え可。
#
# model_info はカタログAPI(/v1/catalog)がそのまま返すメタデータ。モデルを追加・差し替えたら
# ここも更新すること(クライアント向けの説明の単一の情報源)。
#
# 重要: ここに書いただけではモデルは使えない。ollama の実体は必ず pull すること。
#   docker exec ai-hub-ollama ollama pull <実体名>
# 未 pull のまま列挙すると /v1/models には出るのに呼ぶと 500 になる。
# 未 pull・非公開の論理名は下の quality / fast / gemma のようにコメントアウトしておく。

model_list:
  # 生成(ハブの既定・常駐)。Strata 推論エンジン上の Qwen3.8-Flash-Next IQ3_S
  # (125B MoE / アクティブ 6B)。GPU・RAM・SSD の3層に専門家を置くため 16GB GPU でも動く。
  # チャットUI と OpenClaw の既定モデル。
  - model_name: large
    litellm_params:
      model: openai/qwen3.8-flash-next-iq3_s
      api_base: http://strata:8080/v1
      api_key: os.environ/STRATA_API_KEY
      # Strata 自体の既定は high(長く考える)。ハブの既定は思考なしにし、必要なクライアントが
      # リクエストで low / medium / high を指定する(リクエスト側の指定が優先される)。
      reasoning_effort: none
      # drop_params: true でも reasoning_effort を落とさせない(openai/ の未知モデル扱いのため)。
      allowed_openai_params: ["reasoning_effort"]
      timeout: 900
    # context_length / input_modalities / capabilities / sampling_defaults / parallel_requests / engine は
    # カタログが Strata の /props と /v1/models から実際の値を読んで上書きする(ここの値は Strata 停止中の目安)。
    model_info:
      kind: chat
      purpose: 生成全般(要約・抽出・分類・コード・tool call・画像の読み取り・エージェント実行)。ハブの既定モデル
      context_length: 131072
      thinking:
        enabled_by_default: false
        note: 思考を有効にすると message.reasoning_content に入る。最終回答は message.content。
        enable: 'リクエストボディに "reasoning_effort": "low" / "medium" / "high"'
        disable: '既定で無効(ハブが "reasoning_effort": "none" を補う)'
        budget: '"reasoning_budget_tokens": N で思考を N トークン前後で打ち切って回答に移らせる'
      # Strata が受け付けるリクエストオプション(/v1/chat/completions と /strata/v1/chat/completions の両方で効く)。
      options:
        reasoning_effort: '"none" | "low" | "medium" | "high"。ハブの既定は none'
        reasoning: '{"effort": ...}(Responses 形式の書き方。reasoning_effort と同じ意味)'
        chat_template_kwargs: '{"enable_thinking": false} で思考を止める(reasoning_effort: none と同じ)'
        reasoning_budget_tokens: 思考の上限トークン数。超えると短い締めの一文で思考を終えて回答する
        sampling: temperature / top_p / top_k(1〜64) / min_p / seed / repetition_penalty / presence_penalty / frequency_penalty。省略すると sampling_defaults の値。seed や temperature 0 でも出力は完全には固定されない
        images: 'messages[].content に {"type": "image_url", "image_url": {"url": "data:image/png;base64,..."}} を入れる'
        tools: tools / tool_choice / 並列 tool call。宣言していない tool 名の呼び出しはテキストのまま返り、応答の strata_rejected_tool_calls に名前が載る
        response_extras: 応答の timings(prefill・生成の時間と速度)、strata_rejected_tool_calls
      # Strata のネイティブ API。gateway の /strata/* から、ハブと同じ API キーで呼べる(strata-relay が中継)。
      native_api:
        base_path: /strata
        auth: 'Authorization: Bearer <ハブの API キー>(Anthropic SDK の x-api-key でも可)'
        endpoints:
          chat_completions: POST /strata/v1/chat/completions(OpenAI Chat Completions。LiteLLM を通らない)
          messages: POST /strata/v1/messages(Anthropic Messages。thinking / output_config.effort / budget_tokens)
          count_tokens: POST /strata/v1/messages/count_tokens
          responses: POST /strata/v1/responses(OpenAI Responses。ステートレス)
          models: GET /strata/v1/models
          props: GET /strata/props(文脈長・テンプレートの能力・サンプリング既定値・エンジン版)
          status: GET /strata/status(処理中か・待ち行列の長さ・今の段階)
          slots: GET /strata/slots
          metrics: GET /strata/metrics(JSON。Accept text/plain か ?format=prometheus で Prometheus 形式)
          mcp_servers: GET /strata/mcp-servers(Strata に登録した MCP サーバとツール。Strata 上の GET /mcp)
        thinking_default: どの API でも、リクエストが思考の強さを指定しなければ「思考なし」を補う
      notes: 生成 48〜79 tok/s、prefill 1200〜1700 tok/s(2026-11-13 実測)。同時に処理するのは1リクエストだけで、後続は待たされる。長文は読み込みに時間がかかる(1.5 万トークンで約 10 秒)

  # 埋め込み(多言語・常駐)
  - model_name: embed
    litellm_params:
      model: ollama/bge-m3
      api_base: http://ollama:11434
    model_info:
      kind: embedding
      purpose: 類似検索・関連リンク用の埋め込みベクトル
      dimensions: 1024
      notes: 多言語(日本語良好)。索引は次元 1024 で設計すること

  # --- 以下は無効化中 ---
  # quality / quality-next は 2026-11-13 に large(Strata)へ置き換えて非公開にした。重みは
  # ollama に残してある。large と同時に GPU に載せると VRAM が足りず、遅くなるか OOM で 500 になる。
  # 戻すときは large を止める(docker stop ai-hub-strata)か、VRAM の予算を測り直してから
  # コメントを外し、gateway を再起動する。
  #
  # - model_name: quality
  #   litellm_params:
  #     model: ollama_chat/qwen3:14b
  #     api_base: http://ollama:11434
  #   model_info:
  #     kind: chat
  #     purpose: 要約・分類・タグ付け・生成全般(高品質)
  #     context_length: 32768
  #     thinking:
  #       enabled_by_default: true
  #       note: 思考は message.reasoning_content に入る。最終回答は message.content。
  #       disable: ユーザメッセージ末尾に /no_think を付ける
  #       caution: max_tokens が小さいと思考の途中で打ち切られ content が空になる(目安 1024 以上)
  #     notes: VRAM 約 11GB
  #
  # - model_name: quality-next
  #   litellm_params:
  #     model: ollama_chat/qwen3.5:9b
  #     api_base: http://ollama:11434
  #     num_ctx: 65536
  #   model_info:
  #     kind: chat
  #     purpose: 日本語の要約・テーマ抽出
  #     context_length: 65536
  #     thinking:
  #       enabled_by_default: true
  #       note: 思考は message.reasoning_content に入る。最終回答は message.content。
  #       disable: 'リクエストボディに "think": false (または "reasoning_effort": "none")'
  #       caution: /no_think は効かない。抑制しないと簡単な質問でも 1 万トークン超を思考に費やす
  #     notes: VRAM 約 7.3GB(64k)
  #
  # 実体が未 pull のもの。有効化するには pull してからコメントを外し、gateway を再起動する。
  #   docker exec ai-hub-ollama ollama pull llama3.1:8b
  # - model_name: fast
  #   litellm_params:
  #     model: ollama_chat/llama3.1:8b
  #     api_base: http://ollama:11434
  #   model_info:
  #     kind: chat
  #     purpose: 速度優先の軽量タスク・単純な応答
  #     context_length: 32768
  #     thinking:
  #       enabled_by_default: false
  #
  # - model_name: gemma
  #   litellm_params:
  #     model: ollama_chat/gemma4:12b-nvfp4
  #     api_base: http://ollama:11434
  #   model_info:
  #     kind: chat
  #     purpose: 比較・動作確認用の汎用生成

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

  # カタログAPI を唯一の外部窓口(gateway)の下にぶら下げる。catalog コンテナは
  # host にポートを開かず、ここ経由でのみ到達できる。
  # forward_headers で Authorization をそのまま渡し、認証は catalog 側でも検証する
  # (pass-through の auth: true は Enterprise 機能で OSS 版では効かないため)。
  pass_through_endpoints:
    - path: "/v1/catalog"
      target: "http://catalog:8080/catalog"
      methods: ["GET"]
      forward_headers: true
    # Strata のネイティブ API(Anthropic Messages / Responses / props / status / metrics など)。
    # strata-relay がハブの master key を検証し、Strata の鍵に付け替えて中継する。
    - path: "/strata"
      target: "http://strata-relay:8090/strata"
      methods: ["GET", "POST"]
      forward_headers: true
      include_subpath: true

litellm_settings:
  drop_params: true              # OpenAI 互換外パラメータを無視(クライアント差異を吸収)

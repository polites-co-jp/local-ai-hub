# ai-hub — LAN内ローカルLLM推論ハブ
# 6コンテナ構成: ollama(GPU/非公開) + strata(GPU+RAM+SSD/大型MoE) + catalog(非公開)
#               + gateway(LiteLLM/LAN公開) + chat + openclaw
# 設計詳細は ../ARCHITECTURE.md を参照。

services:
  ollama:                          # container 1: 推論ランタイム(埋め込み bge-m3 だけを常駐)
    # 2026-11-13 から生成の主役は strata(論理名 large)。ollama の生成モデル(qwen3:14b /
    # qwen3.5:9b)は重みを残したまま litellm.config.yaml で非公開にしている。GPU は strata と
    # 共有するため、ここで生成モデルを常駐させると strata の専門家キャッシュが縮む。
    image: ollama/ollama:latest
    container_name: ai-hub-ollama
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=-1       # 生成モデルを常駐(コールドスタート回避/低レイテンシ)
      - OLLAMA_HOST=0.0.0.0        # コンテナ内ネットワーク向けに待受(host へは公開しない)
      # 受付コンテキスト長(入力+思考+出力の合計窓)。既定 4096 では Qwen3(thinking)で
      # 途中打ち切りが起きるため引き上げる。32768 = Qwen3 ネイティブ上限。
      - OLLAMA_CONTEXT_LENGTH=32768
      # KV キャッシュを q8_0 量子化し VRAM をほぼ半減 → 16GB に 32k 文脈 + 14B + 埋め込みを収める。
      # 量子化 KV は flash attention 有効が前提(画質劣化はほぼ無し)。
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
    volumes:
      - ollama_models:/root/.ollama   # 重みを名前付きボリュームに永続(喪失時は再 pull で復旧)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [aihub]              # host ポート非公開 = ゲートウェイ経由でのみ到達

  strata:                          # container 2: Strata(大型 MoE 推論エンジン。論理名 large)
    # Qwen3.8-Flash-Next(125B / アクティブ 6B)を GPU・RAM・SSD の3層に分けて置く。
    # 実測(2026-11-13, IQ3_S, 128k): 生成 48〜79 tok/s、prefill 1200〜1700 tok/s、RAM 約 52GB。
    # 前提: ~/.wslconfig の memory を 72GB に上げてあること(既定 16GB では起動しない)。
    # バージョンは固定し、上げるときは docs の手順(docs/DOCKER.md#updating)に従う。
    image: ghcr.io/niko1221/strata:0.2.13-cuda13
    container_name: ai-hub-strata
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - FAMILY=qwen                # ISTA-DASLab の元パック
      - MODEL=IQ3_S                # 54.8GB。96GB 以上の RAM 向けの最高品質
      - CONTEXT=128k
      - API_KEY=${STRATA_API_KEY}  # gateway と Web UI(:20803)からの呼び出しに必須(.env)
      # bge-m3(約 0.7GB)が後から GPU に載れるよう VRAM を残す。残さないと Strata が
      # 空きを専門家キャッシュで使い切り、GPU メモリが RAM に追い出されて数 tok/s に落ちる。
      # STRATA_PLE_AUTO_RAM=0: n-gram 埋め込みの表(26.8GB)を RAM に載せず NVMe から読む。
      # 既定では RAM に余裕があると表をページキャッシュに載せ、WSL VM が上限まで膨らむ。速度の差は数%。
      - STRATA_SET=vram-reserve-mib=1792 STRATA_PLE_AUTO_RAM=0
    volumes:
      # モデル(約 87GB)は名前付きボリューム = Docker のデータ領域(D: の NVMe)に置く。
      # E: は HDD で SSD ストリーミングに使えないため、プロジェクト内バインドマウントの例外。
      - strata_data:/data
    ulimits:
      memlock: -1                  # モデルの RAM を page-lock する
    shm_size: 2g
    stop_grace_period: 2m          # 既定 10 秒では大きなモデルの解放が間に合わない
    # メモリ上限(mem_limit)は付けない。Strata は WSL VM 全体の RAM を前提に配置を決める。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "20803:8080"               # Web UI / API の LAN 公開(Notion 台帳: 20803)。API キー必須
    networks: [aihub]

  catalog:                         # container 3: モデルカタログAPI(host 非公開)
    # 「実際に呼べるモデル」だけを返す。gateway の /model/info(ルーティング定義)と
    # ollama の /api/tags(pull 済み実体)を突合するため、両方に到達できる必要がある。
    # 外部へは gateway の pass-through(/v1/catalog)経由でのみ公開する。
    image: python:3.12-slim
    container_name: ai-hub-catalog
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - GATEWAY_URL=http://gateway:4000
      - OLLAMA_URL=http://ollama:11434
      - STRATA_URL=http://strata:8080              # large の実体が読み込み済みかを確かめる
      - STRATA_API_KEY=${STRATA_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}   # 自身でも Bearer を検証する
      - PORT=8080
    volumes:
      - ./catalog:/app:ro
    command: ["python", "/app/server.py"]
    networks: [aihub]              # host ポート非公開

  gateway:                         # container 4: LiteLLM Proxy(認証/ルーティング/ログ)
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ai-hub-gateway
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      # LAN公開ポート 20800(Notion ポート台帳で local-ai-hub に予約: 20800-20899)。
      # コンテナ内 LiteLLM は :4000 で待受。
      # WAN 遮断は Windows Firewall / ルータで担保。特定LAN IP に絞るなら
      # "192.168.x.y:20800:4000" に変更。
      - "20800:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}   # .env から注入(コミットしない)
      - STRATA_API_KEY=${STRATA_API_KEY}           # large(strata)へのルーティングで使う
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks: [aihub]

  chat:                            # container 5: チャット動作確認アプリ(薄いプロキシ + 静的UI)
    image: python:3.12-slim
    container_name: ai-hub-chat
    restart: unless-stopped
    depends_on: [gateway]
    environment:
      - GATEWAY_URL=http://gateway:4000        # コンテナ内ネットワークで gateway に到達
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}  # 鍵はサーバ側のみ保持(ブラウザに渡さない)
      - CHAT_MODEL=large                       # 既定の論理モデル名
      - PORT=8000
    volumes:
      - ./chat:/app:ro
    command: ["python", "/app/server.py"]
    ports:
      - "20801:8000"               # チャットUI LAN公開(Notion 台帳: 20801)
    networks: [aihub]

  openclaw:                        # container 6: OpenClaw(AIエージェント + Control UI)
    # 推論は gateway 経由で large を使う(GPU は使わない)。設定は ./openclaw/openclaw.json。
    # 設定形式の変更が多いプロジェクトなので、バージョンを固定して明示的に上げる。
    image: ghcr.io/openclaw/openclaw:2026.9.4
    container_name: ai-hub-openclaw
    restart: unless-stopped
    depends_on: [gateway]
    environment:
      - HOME=/home/node
      - TZ=Asia/Tokyo
      # 状態(セッション・記憶・ワークスペース)は名前付きボリューム、設定はリポジトリ側に分ける。
      - OPENCLAW_STATE_DIR=/home/node/.openclaw
      - OPENCLAW_WORKSPACE_DIR=/home/node/.openclaw/workspace
      - OPENCLAW_CONFIG_PATH=/home/node/.openclaw-config/openclaw.json
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}   # Control UI のログイン用(.env)
      # gateway への API キー。エージェントはシェルを実行できるため、この値を読める点に注意。
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    volumes:
      - openclaw_state:/home/node/.openclaw
      - ./openclaw:/home/node/.openclaw-config
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    ports:
      - "20802:18789"              # Control UI LAN公開(Notion 台帳: 20802)
    init: true
    cap_drop: [NET_RAW, NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [aihub]              # ホストの docker.sock は渡さない(サンドボックス機能は使わない)

volumes:
  ollama_models:
  openclaw_state:
  strata_data:
    name: ai-hub-strata-data       # Phase 1 の試験で作ったボリュームをそのまま使う(再ダウンロード回避)

networks:
  aihub:
